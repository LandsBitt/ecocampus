# Testes e checagens em todo PR e em todo push na main (SPEC Fase 5).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    # O mesmo Postgres do docker-compose: a importação usa INSERT ... ON CONFLICT.
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ecocampus
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: ecocampus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecocampus -d ecocampus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # O conftest cria e migra o banco de teste (o nome precisa terminar em _test).
      TEST_DATABASE_URL: postgresql+psycopg://ecocampus:dev@localhost:5432/ecocampus_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      # Fumaça do jeito de produção (Linux, Gunicorn + worker do Uvicorn): o app sobe e responde.
      - name: Sobe com Gunicorn e responde /health
        env:
          DATABASE_URL: postgresql+psycopg://ecocampus:dev@localhost:5432/ecocampus
          FIREBASE_PROJECT_ID: ecocampus-ci
        run: |
          gunicorn app.main:app -k uvicorn.workers.UvicornWorker -b 127.0.0.1:8000 --daemon --pid gunicorn.pid
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8000/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8000/health
          kill "$(cat gunicorn.pid)"

  frontend:
    name: Frontend (lint, tipos, testes, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
