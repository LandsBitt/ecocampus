services:
  db:
    image: postgres:16-alpine
    container_name: ecocampus-db
    environment:
      POSTGRES_USER: ecocampus
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: ecocampus
    ports:
      - "5432:5432"
    volumes:
      - ecocampus_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecocampus -d ecocampus"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ecocampus_pgdata:
