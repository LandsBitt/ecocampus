<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ECOCAMPUS · UNITAU</title>
    <meta
      name="description"
      content="Painel de gestão de consumo de água e energia dos campi da Universidade de Taubaté."
    />
    <meta name="theme-color" content="#0a100e" />
    <link rel="icon" type="image/png" sizes="48x48" href="/image/unitau-logo-48.png" />
    <link rel="apple-touch-icon" href="/image/unitau-logo-180.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fontes direto no HTML e sem bloquear a primeira pintura: o texto aparece
         na fonte do sistema e troca quando a fonte chega (display=swap). -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      />
    </noscript>
    <script>
      // Aplica o tema antes da primeira pintura, com a mesma regra do
      // ThemeProvider: sem escolha salva, o padrão é o tema noturno.
      ;(function () {
        var stored = null
        try {
          stored = localStorage.getItem('ecocampus:theme')
        } catch (e) {
          /* localStorage bloqueado: fica no padrão */
        }
        var dark =
          stored === 'system'
            ? window.matchMedia('(prefers-color-scheme: dark)').matches
            : stored !== 'light'
        if (dark) document.documentElement.classList.add('dark')
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        if (!dark) {
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f2ece1')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
